datos.page.html 

<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Persistencia de datos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid fixed>
    <ion-row>
      <ion-col size="12">
        <ion-input type="text" placeholder="Ingrese su nombre"></ion-input>
      </ion-col>
      </ion-row>
  </ion-grid>
</ion-content>

<ion-grid fixed>
  <ion-row>
    <ion-col size="12">
      <ion-input [(ngModel)]="txt" type="txt" label="ingresa texto" labelPlacement="floating"></ion-input>

    <ion-col size="6">
      <ion-button (click)="guardar()" shape="round">
        Gruardar texto
      </ion-button>
    </ion-col>

    <ion-col size="6">
      <ion-button (click)="eliminar()" shape="round">
        Eliminar texto
      </ion-button>
    </ion-col>

    <ion-col size="12">
      <ion-label>{{ lbl }}</ion-label>
    </ion-col>

  </ion-col>
  </ion-row>  
  </ion-grid>
